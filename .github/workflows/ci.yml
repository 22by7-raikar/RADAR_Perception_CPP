name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: clang-format-18 --dry-run --Werror $(git ls-files '*.cpp' '*.hpp')

  build-test:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Release]
        include:
          - compiler: gcc
            cxx: g++
          - compiler: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build libeigen3-dev
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DRP_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Unit tests
        run: ctest --test-dir build -L unit --output-on-failure
      - name: Regression suite
        working-directory: build/tests
        run: ./radar_regression
      - name: Upload regression report
        if: always() && matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: build/tests/regression_report.md
      - name: Demo
        run: |
          ./build/radar_demo --frames 20 --out build/out
          ./build/radar_demo --scenario scenarios/edge_cases.csv --frames 20 --out build/out_edge
          ./build/tracking_demo --duration 3 --out build/out_tracking
          ./build/odometry_demo --duration 3 --out build/out_odometry
          ./build/fusion_demo --duration 3 --out build/out_fusion
      - name: Benchmarks (smoke)
        run: ./build/bench/radar_bench --benchmark_min_time=0.05s

  sanitizers:
    name: gcc / ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build libeigen3-dev
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DRP_ENABLE_SANITIZERS=ON
          -DRP_WARNINGS_AS_ERRORS=ON
          -DRP_BUILD_BENCHMARKS=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build -L unit --output-on-failure

  arm64:
    name: aarch64 cross-compile (tests under QEMU)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain
        run: >
          sudo apt-get update && sudo apt-get install -y ninja-build libeigen3-dev
          g++-aarch64-linux-gnu qemu-user
      - name: Configure
        run: >
          cmake -S . -B build-arm64 -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/aarch64-linux-gnu.cmake
          -DRP_WARNINGS_AS_ERRORS=ON -DRP_BUILD_BENCHMARKS=OFF
      - name: Build
        run: cmake --build build-arm64 --parallel
      - name: Unit tests (QEMU)
        env:
          RP_SKIP_TIMING: "1"
        run: ctest --test-dir build-arm64 -L unit --output-on-failure

  ros2:
    name: ROS 2 Jazzy (build + launch smoke test)
    runs-on: ubuntu-24.04
    container: ros:jazzy
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: >
          apt-get update && apt-get install -y ninja-build libeigen3-dev
          ros-jazzy-visualization-msgs ros-jazzy-tf2-ros ros-jazzy-ros2launch
      - name: Build and install the core library
        run: |
          cmake -S . -B build -G Ninja -DRP_BUILD_TESTS=OFF -DRP_BUILD_BENCHMARKS=OFF -DRP_BUILD_APPS=OFF
          cmake --build build --parallel
          cmake --install build --prefix /opt/radar_perception
      - name: colcon build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --base-paths ros2 --event-handlers console_direct+ \
            --cmake-args -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/opt/radar_perception
      - name: Launch smoke test
        shell: bash
        run: ./scripts/ros2_smoke_test.sh
